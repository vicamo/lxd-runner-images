name: Build LXD images

on:
  workflow_call:
    inputs:
      image_type:
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # What the runner type of the build can do, e.g. hosted arm64 runners have no
  # /dev/kvm and can't run virtual machines.
  capabilities:
    runs-on: ${{ endsWith(inputs.image_type, '-arm64') && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    outputs:
      instance_types: ${{ steps.kvm.outputs.instance_types }}
    steps:
      - name: Detect KVM
        id: kvm
        run: |
          if [[ -c /dev/kvm ]]; then
            echo 'instance_types=["container", "vm"]'
          else
            echo 'instance_types=["container"]'
          fi | tee -a "${GITHUB_OUTPUT}"

  build:
    needs: capabilities
    runs-on: ${{ endsWith(inputs.image_type, '-arm64') && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        instance_type: ${{ fromJSON(needs.capabilities.outputs.instance_types) }}
    env:
      image_type: ${{ inputs.image_type }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Free disk space
        run: |
          df -h
          sudo swapoff -a
          sudo rm -f /mnt/swapfile
          docker image prune --all --force
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet \
            /usr/share/swift
          df -h

      # Runners with a separate temporary disk on /mnt need both disks to hold
      # the LXD images. The others have a single large disk.
      - name: Merge disks
        run: |
          if ! mountpoint --quiet /mnt; then
            sudo mkdir /merged
            exit
          fi
          reserve_kb=$((2 * 1024 * 1024))
          devices=()
          for dir in "" /mnt; do
            free_kb=$(df --block-size=1024 --output=avail "${dir:-/}" | tail -n 1)
            sudo fallocate --length $(((free_kb - reserve_kb) * 1024)) "${dir}/loop.img"
            devices+=("$(sudo losetup --find --show "${dir}/loop.img")")
          done
          sudo pvcreate --force "${devices[@]}"
          sudo vgcreate vgmerged "${devices[@]}"
          sudo lvcreate --extents 100%FREE --name lvmerged vgmerged
          sudo mkfs.ext4 -m 0 /dev/vgmerged/lvmerged
          sudo mkdir /merged
          sudo mount /dev/vgmerged/lvmerged /merged
          df -h /merged

      # LXD does not create the source of a dir pool.
      - name: Create LXD pool directory
        run: sudo mkdir /merged/lxd

      # The action is in alpha, hence the pinned commit.
      - name: Setup LXD
        uses: canonical/setup-lxd@e3ef25fc529b40aa403b264cdf44e7882b361164
        with:
          channel: 5.21/stable
          preseed: |
            config:
              images.compression_algorithm: none
            storage_pools:
            - name: default
              driver: dir
              config:
                source: /merged/lxd
            networks:
            - name: lxdbr0
              type: bridge
              config:
                ipv4.address: auto
                ipv6.address: none
            profiles:
            - name: default
              devices:
                root:
                  path: /
                  pool: default
                  type: disk
                eth0:
                  name: eth0
                  network: lxdbr0
                  type: nic

      # Keep exported images off the root filesystem as well.
      - name: Move LXD images
        run: |
          lxc storage volume create default images
          lxc config set storage.images_volume default/images

      # A virtual machine gets 1 CPU, 1 GiB of memory and a 10 GiB disk by default.
      - name: Size virtual machines
        if: matrix.instance_type == 'vm'
        run: |
          lxc profile set default limits.cpu="$(nproc)" limits.memory=12GiB
          lxc profile device set default root size=75GiB

      - name: Setup Packer
        uses: hashicorp/setup-packer@v3.4.0
        with:
          version: 1.16.1

      - name: Build LXD image
        shell: pwsh
        env:
          PACKER_GITHUB_API_TOKEN: ${{ github.token }}
          PKR_VAR_github_token: ${{ github.token }}
          PACKER_NO_COLOR: 1
        run: |
          $env:PKR_VAR_image_version = "$(Get-Date -AsUTC -Format yyyyMMdd).${{ github.run_number }}.${{ github.run_attempt }}"
          Import-Module ./helpers/GenerateResourcesAndImage.ps1
          GenerateResourcesAndImage `
            -ImageType ($env:image_type -replace '-arm64$', '_Arm64') `
            -InstanceType ${{ matrix.instance_type }} `
            -OnError cleanup

      - name: Show the software report
        id: report
        run: |
          readme=${image_type^}
          readme=images/ubuntu/${readme/-arm64/-Arm64}-Readme.md
          echo "readme=${readme}" | tee -a "${GITHUB_OUTPUT}"
          cat "${readme}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload generated reports
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ inputs.image_type }}-${{ matrix.instance_type }}
          path: |
            ${{ steps.report.outputs.readme }}
            images/ubuntu/software-report.json
